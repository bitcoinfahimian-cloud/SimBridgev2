name: Build SimBridge Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'SimBridge-Suite-v4.2/android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimBridge-Suite-v4.2/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=No fixed signing key::ANDROID_KEYSTORE_BASE64 is not set, so this APK uses a throwaway debug key and cannot update an installed build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simbridge.jks"
          echo "SIMBRIDGE_KEYSTORE_FILE=$RUNNER_TEMP/simbridge.jks" >> "$GITHUB_ENV"

      - name: Build Debug APK
        env:
          SIMBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee gradle.log || {
            # Surface Kotlin/Gradle errors as an annotation so they show on the run summary page.
            msg=$( { grep -E "^e: |error:" gradle.log | sed 's|^e: file://.*/src/main/|e: src/main/|'; \
                     grep -A 8 "What went wrong" gradle.log; } | grep -v '^--$' | head -n 60 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle errors::${msg:-no error lines found, see full log}"
            exit 1
          }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SimBridge-Android-v4-Debug
          path: SimBridge-Suite-v4.2/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
