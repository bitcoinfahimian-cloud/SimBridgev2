name: Build SimBridge iOS IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'SimBridge-Suite-v4.2/ios/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: SimBridge-Suite-v4.2/ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          set -o pipefail
          xcodebuild \
            -project SimBridgeiOS.xcodeproj \
            -scheme SimBridgeiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log || {
            # Surface compiler errors as an annotation so they show on the run summary page.
            msg=$(grep -E "error:" xcodebuild.log | sed 's|^.*/Sources/|Sources/|' | sort -u | head -n 60 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=xcodebuild errors::${msg:-no error: lines found, see full log}"
            exit 1
          }

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SimBridgeiOS.app Payload/
          zip -r SimBridgeiOS-Unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimBridgeiOS-v4-Unsigned-IPA
          path: SimBridge-Suite-v4.2/ios/SimBridgeiOS-Unsigned.ipa
          retention-days: 30
