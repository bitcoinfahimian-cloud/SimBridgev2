<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimBridge iOS – پیش‌نمایش</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --fill:#E5E5EA; --fill2:#D1D1D6; --sep:rgba(60,60,67,.18);
    --label:#000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3);
    --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --indigo:#5856D6;
    --teal:#30B0C7; --purple:#AF52DE; --pink:#FF2D55; --gray:#8E8E93; --cyan:#32ADE6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;
    background:#dde1e8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Vazirmatn",Tahoma,sans-serif;color:var(--label);padding:30px}
  svg{display:block;flex-shrink:0}
  .note{max-width:300px;color:#3a3a3c;font-size:14px;line-height:1.9}
  .note h1{font-size:20px;color:#000;margin-bottom:10px}
  .note button{margin-top:8px;margin-inline-end:6px;padding:7px 14px;border-radius:99px;border:none;background:#fff;color:var(--blue);
    cursor:pointer;font:inherit;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .phone{width:390px;height:844px;border-radius:56px;padding:12px;background:#1c1c1e;box-shadow:0 0 0 2px #444,0 30px 80px rgba(0,0,0,.35);position:relative}
  .screen{width:100%;height:100%;border-radius:46px;overflow:hidden;position:relative;background:var(--bg)}
  .screen.white{background:#fff}
  .status{height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-weight:600;font-size:15px;position:relative;z-index:9;direction:ltr}
  .island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:10}
  .content{position:absolute;top:50px;bottom:0;left:0;right:0;overflow-y:auto;padding:0 0 110px;scrollbar-width:none}
  .content::-webkit-scrollbar,.chatscroll::-webkit-scrollbar{display:none}

  /* navigation bar */
  .navtop{height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;color:var(--blue);gap:14px}
  h2.title{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 16px 10px}
  .badge{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--sec)}
  .badge i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .search{display:flex;align-items:center;gap:6px;background:rgba(118,118,128,.12);border-radius:10px;padding:0 8px;height:36px;margin:0 16px 12px;color:var(--sec)}
  .search input{border:none;background:none;outline:none;font:inherit;font-size:17px;flex:1;color:var(--label)}

  /* grouped (Settings) */
  .ghead{font-size:13px;color:var(--sec);text-transform:uppercase;padding:0 32px 7px}
  .group{background:var(--card);border-radius:12px;margin:0 16px 22px;overflow:hidden}
  .gfoot{font-size:13px;color:var(--sec);padding:0 32px;margin:-15px 0 22px;line-height:1.45}
  .row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;position:relative;font-size:17px;cursor:default}
  .row+.row::before{content:"";position:absolute;top:0;inset-inline-start:57px;inset-inline-end:0;height:.5px;background:var(--sep)}
  .row .val{margin-inline-start:auto;color:var(--sec);font-size:17px;display:flex;align-items:center;gap:6px}
  .row .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;direction:ltr}
  .row.btn{cursor:pointer}.row.btn:active{background:var(--fill)}
  .row.dis{opacity:.4;pointer-events:none}
  .row input{flex:1;border:none;outline:none;font:inherit;font-size:17px;direction:ltr;text-align:left;background:none}
  .row .set{color:var(--blue);font-weight:400}
  .row.red{color:var(--red)}
  .chev{color:var(--ter)}
  .ico{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;background:var(--c)}
  .probe{font:12px ui-monospace,Menlo,monospace;color:var(--sec);direction:ltr;text-align:left;padding:8px 16px 12px 57px;position:relative}
  .probe::before{content:"";position:absolute;top:0;left:57px;right:0;height:.5px;background:var(--sep)}

  /* connection card */
  .ccard{background:var(--card);border-radius:22px;padding:18px;margin:4px 16px 22px}
  .chd{display:flex;align-items:center;gap:14px}
  .devic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:var(--blue);background:rgba(0,122,255,.12)}
  .dn{font-size:20px;font-weight:600}.ds{font-size:15px;color:var(--sec);margin-top:2px}
  .crow{display:flex;align-items:center;justify-content:space-between;margin:16px 0}
  .pill{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;
    background:color-mix(in srgb,var(--c) 12%,transparent)}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .enc{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--sec);direction:ltr}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--bg);border-radius:14px;padding:12px}
  .tile svg{color:var(--c);margin-bottom:6px}
  .tile .tt{font-size:12px;color:var(--sec)}.tile .tv{font-size:15px;font-weight:600;margin-top:2px}

  /* plain lists */
  .list{background:#fff}
  .lrow{display:flex;align-items:center;gap:12px;padding:9px 16px;position:relative;cursor:pointer;background:#fff}
  .lrow:active{background:var(--fill)}
  .lrow+.lrow::before{content:"";position:absolute;top:0;inset-inline-start:68px;inset-inline-end:0;height:.5px;background:var(--sep)}
  .av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex-shrink:0;font-family:ui-rounded,-apple-system,sans-serif}
  .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:15px;color:var(--sec);display:flex;align-items:center;gap:4px}
  .meta{margin-inline-start:auto;color:var(--sec);font-size:15px;white-space:nowrap}
  .grow{flex:1;min-width:0}
  .shead{position:sticky;top:-1px;z-index:2;background:#F7F7F7;font-size:15px;font-weight:600;padding:3px 16px;color:var(--sec)}
  .rbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:rgba(0,122,255,.12);cursor:pointer;flex-shrink:0}
  .rbtn.off{opacity:.4}
  .index{position:absolute;inset-inline-end:2px;top:200px;display:flex;flex-direction:column;z-index:3}
  .index span{font-size:11px;font-weight:600;color:var(--blue);width:18px;height:15px;text-align:center;cursor:pointer}
  .empty{text-align:center;color:var(--sec);padding:80px 40px;font-size:15px;line-height:1.5}
  .empty b{display:block;color:var(--label);font-size:22px;margin:10px 0 4px}

  /* keypad */
  .kp{display:flex;flex-direction:column;align-items:center;height:100%;padding-top:60px;background:#fff}
  .num{font-size:36px;height:48px;direction:ltr;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .via{font-size:13px;height:20px;color:var(--sec);margin:2px 0 34px}
  .via.warn{color:var(--orange)}
  .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 24px;direction:ltr}
  .key{width:76px;height:76px;border-radius:50%;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:background .12s}
  .key:active{background:var(--fill2)}
  .key b{font-size:34px;font-weight:400;line-height:1}.key small{font-size:10px;font-weight:700;letter-spacing:1.5px;opacity:.7;margin-top:1px}
  .key.green{background:var(--green);color:#fff}.key.green:active{background:#2aa44a}
  .key.dis{opacity:.45;pointer-events:none}
  .key.clear{background:none;color:var(--gray)}

  /* floating glass tab bar */
  .tabbar{position:absolute;bottom:22px;left:18px;right:18px;height:64px;border-radius:32px;display:flex;gap:2px;padding:6px;z-index:6;
    background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
    border:1px solid rgba(255,255,255,.9);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 8px 20px rgba(0,0,0,.12);transition:transform .25s,opacity .25s}
  .tabbar.hide{transform:translateY(120px);opacity:0}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:rgba(0,0,0,.75);
    cursor:pointer;border-radius:26px;transition:background .25s,color .25s}
  .tab.on{color:var(--blue);background:rgba(0,122,255,.12)}
  .callpill{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:6;background:var(--green);color:#fff;border-radius:99px;
    padding:10px 18px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.15);cursor:pointer;white-space:nowrap}

  /* chat */
  .chat{position:absolute;inset:0;top:50px;background:#fff;z-index:7;display:flex;flex-direction:column}
  .chatnav{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;border-bottom:.5px solid var(--sep);
    background:rgba(249,249,249,.94)}
  .chatnav .back{display:flex;align-items:center;color:var(--blue);font-size:17px;cursor:pointer}
  [dir=rtl] .chatnav .back svg{transform:scaleX(-1)}
  .chatnav .ttl{font-size:17px;font-weight:600}
  .chatnav .ph{justify-self:end;color:var(--blue);padding:0 8px;cursor:pointer}
  .chatscroll{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
  .chathead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
  .chathead .n{font-size:13px;font-weight:600}.chathead .s{font-size:12px;color:var(--sec);direction:ltr}.chathead .x{font-size:11px;color:var(--ter)}
  .stamp{text-align:center;font-size:11px;font-weight:500;color:var(--sec);padding:12px 0 4px}
  .bub{max-width:75%;padding:9px 14px;border-radius:20px;font-size:17px;line-height:1.3}
  .bub.in{background:var(--fill);align-self:flex-start}
  .bub.out{background:var(--blue);color:#fff;align-self:flex-end}
  .composer{padding:8px 12px 30px;background:rgba(249,249,249,.94);border-top:.5px solid var(--sep);display:flex;gap:8px;align-items:flex-end}
  .composer input{flex:1;border:.5px solid var(--fill2);border-radius:20px;padding:9px 14px;font:inherit;font-size:17px;outline:none;background:#fff}
  .send{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;margin-bottom:3px}
  .send.off{background:rgba(142,142,147,.5);pointer-events:none}
  .warnline{font-size:12px;color:var(--orange);text-align:center;width:100%}

  /* active call */
  .call{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;direction:ltr;
    background:linear-gradient(180deg,rgba(0,122,255,.14),var(--bg) 45%,var(--bg))}
  .call .min{position:absolute;top:58px;left:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.8);display:grid;place-items:center;cursor:pointer}
  .call .who{font-size:32px;margin-top:10px;max-width:90%;text-align:center}
  .call .numl{font-size:20px;color:var(--sec)}
  .call .tm{font-size:20px;color:var(--sec);font-variant-numeric:tabular-nums;margin-top:2px}
  .call .via2{font-size:13px;color:var(--ter);margin-top:4px}
  .ctrls{display:flex;gap:28px;margin-top:auto}
  .cbtn{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
  .cbtn div{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .cbtn.on div{background:#000;color:#fff;box-shadow:none}
  .cpad{display:grid;grid-template-columns:repeat(3,70px);gap:12px 22px;margin-top:auto}
  .cpad .key{width:70px;height:70px;background:#fff}.cpad .key b{font-size:31px}
  .endrow{position:relative;width:100%;display:flex;justify-content:center;margin:24px 0 40px}
  .end{width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer}
  .hidebtn{position:absolute;right:40px;top:26px;font-size:17px;font-weight:500;cursor:pointer;width:76px;text-align:center}
</style>
</head>
<body>
<div class="note" id="note"></div>
<div class="phone"><div class="screen" id="screen">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span id="sbar"></span></div>
  <div class="content" id="content"></div>
  <div id="pill"></div>
  <div class="tabbar" id="tabbar"></div>
  <div id="chat"></div>
  <div id="call"></div>
</div></div>

<script>
/* ---------- state ---------- */
let lang='fa', tab='calls', dial='', connected=true, query='', chat=null, call=null, langOpen=false;
const model='Xiaomi Mi 10T Pro';
const T=(en,fa)=>lang==='fa'?fa:en;
const faNum=s=>lang==='fa'?String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]):String(s);

/* ---------- icons (SF Symbols look-alikes) ---------- */
const P={
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 grid:[6,12,18].map(y=>[6,12,18].map(x=>`<circle cx="${x}" cy="${y}" r="1.9" fill="currentColor" stroke="none"/>`).join('')).join(''),
 message:'<path d="M12 4c4.97 0 9 3.13 9 7s-4.03 7-9 7c-1 0-2-.12-2.9-.36L4.5 20l1.2-3.6C4 15 3 13.1 3 11c0-3.87 4.03-7 9-7z"/>',
 gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/><circle cx="12" cy="12" r="6.5"/>',
 phone:'<path d="M5.5 3.5h3.2l1.8 4.6-2.3 1.5a11.5 11.5 0 006.2 6.2l1.5-2.3 4.6 1.8v3.2a1.5 1.5 0 01-1.6 1.5C10.6 19.4 4.6 13.4 4 5.1a1.5 1.5 0 011.5-1.6z" fill="currentColor" stroke="none"/>',
 micslash:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M4 4l16 16"/>',
 speaker:'<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9a4 4 0 010 6M19 6.5a7.5 7.5 0 010 11"/>',
 chevdown:'<path d="M6 9l6 6 6-6"/>', back:'<path d="M15 4l-8 8 8 8"/>', chev:'<path d="M9 6l6 6-6 6"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
 compose:'<path d="M12 4H5a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1v-7"/><path d="M18 3l3 3-9 9H9v-3z"/>',
 up:'<path d="M12 18V6M6.5 11.5L12 6l5.5 5.5"/>',
 del:'<path d="M9 5h11a1 1 0 011 1v12a1 1 0 01-1 1H9l-6-7z" fill="currentColor" stroke="none"/><path d="M12.5 9l5 6M17.5 9l-5 6" stroke="#fff"/>',
 qr:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8" y="8" width="8" height="8" rx="1"/>',
 globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',
 wifi:'<path d="M2.5 9a14 14 0 0119 0M5.5 12.5a9.5 9.5 0 0113 0M8.7 15.8a5 5 0 016.6 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/>',
 pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 wave:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',
 arrows:'<path d="M8 20V4M4 8l4-4 4 4M16 4v16M12 16l4 4 4-4"/>',
 refresh:'<path d="M19.5 12a7.5 7.5 0 11-2.6-5.7"/><path d="M19.5 4v4.5H15"/>',
 apps:'<rect x="5" y="3" width="14" height="7" rx="2"/><rect x="5" y="14" width="14" height="7" rx="2"/><path d="M12 10v4"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/>',
 radio:'<circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M8 8a5.5 5.5 0 000 8M16 8a5.5 5.5 0 010 8M5 5a9.5 9.5 0 000 14M19 5a9.5 9.5 0 010 14"/>',
 ecg:'<path d="M2 12h4.5l2-5 4 10 2.5-6 1.5 1H22"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 antenna:'<circle cx="12" cy="10" r="1.8" fill="currentColor"/><path d="M12 12v9M8 6a5.5 5.5 0 000 8M16 6a5.5 5.5 0 010 8"/>',
 link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1.2 1.2M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1.2-1.2"/>',
 smart:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
 outa:'<path d="M8 16L16 8M10 8h6v6"/>', ina:'<path d="M16 8l-8 8M8 10v6h6"/>',
};
const ic=(n,s=20,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ---------- sample data (same shape as the real model: number, name, isOutgoing, date / from, senderName, body, isOutgoing) ---------- */
const now=Date.now(), H=3600e3, D=24*H;
const recents=[
 {name:'Sara Ahmadi',fa:'سارا احمدی',number:'+98 912 345 6789',out:false,date:now-0.4*H},
 {name:'Mom',fa:'مامان',number:'+98 912 000 1122',out:true,date:now-3*H},
 {name:'+98 21 8888 1234',fa:'',number:'+98 21 8888 1234',out:false,date:now-D},
 {name:'Reza Karimi',fa:'رضا کریمی',number:'+98 935 111 2233',out:true,date:now-2*D},
 {name:'Ali Rahimi',fa:'علی رحیمی',number:'+98 901 765 4321',out:false,date:now-4*D},
 {name:'Neda Hosseini',fa:'ندا حسینی',number:'+98 919 222 3344',out:true,date:now-9*D},
];
let msgs=[
 {from:'+98 912 345 6789',out:false,body:['Are you coming tonight?','امشب میای؟'],date:now-1.2*H},
 {from:'+98 912 345 6789',out:true,body:['Yes, around 6','آره، حدود ساعت ۶'],date:now-1.1*H},
 {from:'+98 912 345 6789',out:false,body:['See you at 6 then 👋','پس ساعت ۶ می‌بینمت 👋'],date:now-0.6*H},
 {from:'+98 21 8888 1234',out:false,body:['Your appointment is confirmed for Tuesday.','نوبت شما برای سه‌شنبه تأیید شد.'],date:now-5*H},
 {from:'+98 912 000 1122',out:false,body:['Call me when you are free','هر وقت آزاد شدی زنگ بزن'],date:now-D-2*H},
 {from:'+98 935 111 2233',out:true,body:['Thanks, got it!','ممنون، رسید!'],date:now-3*D},
];
const nameOf=n=>{const r=recents.find(x=>x.number===n);return r?(lang==='fa'&&r.fa?r.fa:r.name):n};
const palette=['#007AFF','#5856D6','#AF52DE','#FF2D55','#FF9500','#30B0C7','#34C759','#32ADE6'];
const colorFor=s=>palette[[...s].reduce((a,c)=>a+c.codePointAt(0),0)%palette.length];
const initials=s=>s.split(' ').filter(w=>/\p{L}/u.test(w[0]||'')).slice(0,2).map(w=>w[0].toUpperCase()).join(lang==='fa'?'‌':'');
function av(name,size=40){const i=initials(name),c=colorFor(name);
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${size*.38}px;background:linear-gradient(${c}b3,${c})">${i||ic('person',size*.5,0).replace('fill="none"','fill="#fff"')}</div>`}
const time=d=>new Date(d).toLocaleTimeString(lang==='fa'?'fa-IR':'en-US',{hour:'numeric',minute:'2-digit'});
function shortDate(d){const dt=new Date(d),t0=new Date();t0.setHours(0,0,0,0);
  if(dt>=t0)return time(d); if(dt>=t0-D)return T('Yesterday','دیروز');
  if(now-d<7*D)return dt.toLocaleDateString(lang==='fa'?'fa-IR':'en-US',{weekday:'long'});
  return dt.toLocaleDateString(lang==='fa'?'fa-IR':'en-US',{day:'numeric',month:'short'})}
const status=()=>connected?{t:T('Connected','متصل'),s:T('Connected','متصل'),c:'var(--green)'}:{t:T('Searching…','در حال جستجو…'),s:T('Offline','قطع'),c:'var(--orange)'};

/* ---------- screens ---------- */
const row=(icon,c,title,val='',opts={})=>`<div class="row ${opts.cls||''}" ${opts.click?`onclick="${opts.click}"`:''}>
  <div class="ico" style="--c:${c}">${ic(icon,16,2.2)}</div><span ${opts.tc?`style="color:${opts.tc}"`:''}>${title}</span>
  ${val!==''?`<span class="val">${val}</span>`:''}</div>`;
const tile=(icon,title,val,ok)=>`<div class="tile" style="--c:${ok?'var(--green)':'var(--gray)'}">${ic(icon,17,2.2)}<div class="tt">${title}</div><div class="tv">${val}</div></div>`;

function settings(){const st=status();return `<div class="navtop"></div><h2 class="title">${T('Settings','تنظیمات')}</h2>
 <div class="ccard">
  <div class="chd"><div class="devic">${ic('smart',28,1.6)}</div><div style="min-width:0"><div class="dn">${model}</div>
   <div class="ds">${T('Android SIM bridge · Bluetooth LE','پل سیم‌کارت اندروید · بلوتوث کم‌مصرف')}</div></div></div>
  <div class="crow"><span class="pill" style="--c:${st.c}"><i></i>${st.t}</span><span class="enc">${ic('lock',12,2)}AES-256-GCM</span></div>
  <div class="tiles">
   ${tile('antenna',T('Bluetooth','بلوتوث'),T('On','روشن'),true)}
   ${tile('link',T('BLE Link','اتصال BLE'),connected?T('Connected','متصل'):T('Disconnected','قطع'),connected)}
   ${tile('phone',T('Call Audio','صدای تماس'),connected?T('Ready','آماده'):T('Off','غیرفعال'),connected)}
   ${tile('wave',T('Audio Stream','جریان صدا'),call?T('Streaming','فعال'):T('Idle','غیرفعال'),!!call)}
  </div>
 </div>
 <div class="group">${row('qr','var(--blue)',T('Pair Again (Scan QR)','جفت‌سازی دوباره (اسکن QR)'),'',{cls:'btn'})}</div>
 <div class="gfoot">${T('Open SimBridge on your Android phone and scan the QR code it shows.','SimBridge را روی گوشی اندروید باز کنید و کد QR آن را اسکن کنید.')}</div>
 <div class="ghead">${T('General','عمومی')}</div>
 <div class="group">${row('globe','var(--blue)',T('Language','زبان'),`${lang==='fa'?'فارسی':'English'} ${ic('chevdown',13,2.4)}`,{cls:'btn',click:"setLang(lang==='fa'?'en':'fa')"})}</div>
 <div class="ghead">${T('Call Audio','صدای تماس')}</div>
 <div class="group">
  ${row('wifi','var(--blue)',T('Endpoint','نقطهٔ اتصال'),'<span class="mono">192.168.43.1:8119</span>')}
  <div class="row"><div class="ico" style="--c:var(--gray)">${ic('pencil',16,2.2)}</div><input placeholder="${T('Manual host IP','IP دستی میزبان')}"><span class="set">${T('Set','ثبت')}</span></div>
  ${row('wave','var(--green)',T('Stream','جریان صدا'),call?T('Streaming','در حال پخش'):T('Idle','غیرفعال'))}
  ${row('arrows','var(--teal)',T('Packets','بسته‌ها'),`<span class="mono">↓ ${call?'1842':'0'}   ↑ ${call?'1839':'0'}</span>`)}
  ${row('refresh','var(--orange)',T('Reconnects','اتصال‌های دوباره'),'0')}
 </div>
 <div class="gfoot">${T('Encrypted voice over local Wi-Fi or Hotspot (UDP 8119).','صدای رمزنگاری‌شده روی Wi-Fi یا هات‌اسپات محلی (UDP 8119).')}</div>
 <div class="ghead">${T('Diagnostics','عیب‌یابی')}</div>
 <div class="group">
  ${row('apps','var(--purple)',T('Companion Service','سرویس همراه'),T('Bound','متصل'))}
  ${row('list','var(--indigo)',T('Call Events','رویدادهای تماس'),'12')}
  ${row('radio','var(--green)',T('Send Ping','ارسال پینگ'),'',{cls:'btn'+(connected?'':' dis')})}
  ${row('ecg','var(--orange)',T('Run Android Audio Probe','تست سخت‌افزاری صدای اندروید'),'',{cls:'btn'+(connected?'':' dis')})}
 </div>
 <div class="group">${row('trash','var(--red)',T('Unpair & Clear Key','حذف جفت‌سازی و کلید'),'',{cls:'btn',tc:'var(--red)'})}</div>
 <div class="gfoot">${T("Removes the pairing key from this iPhone's Keychain.",'کلید جفت‌سازی از Keychain این آیفون پاک می‌شود.')}</div>`}

function recentsScreen(){const st=status();
 return `<div class="navtop"><span class="badge" style="--c:${st.c}"><i></i>${st.s}</span></div><h2 class="title">${T('Recents','اخیر')}</h2>
 <div class="list">${recents.map((r,i)=>{const n=nameOf(r.number);return `<div class="lrow" onclick="startCall('${r.number}')">${av(n)}
  <div class="grow"><div class="nm">${n}</div><div class="sub">${ic(r.out?'outa':'ina',13,2.4)}${r.out?T('Outgoing','خروجی'):T('Incoming','ورودی')}</div></div>
  <span class="meta">${shortDate(r.date)}</span><span style="color:${connected?'var(--blue)':'var(--ter)'}">${ic('phone',15)}</span></div>`}).join('')}</div>`}

function contactsScreen(){
 const all=[...new Set([...recents.map(r=>r.number),...msgs.map(m=>m.from)])].map(n=>({n,name:nameOf(n)}))
   .filter(c=>!query||c.name.toLowerCase().includes(query.toLowerCase())||c.n.includes(query))
   .sort((a,b)=>a.name.localeCompare(b.name,lang));
 const key=c=>c.name!==c.n&&/\p{L}/u.test(c.name[0])?c.name[0].toUpperCase():'#';
 const groups={};all.forEach(c=>(groups[key(c)]=groups[key(c)]||[]).push(c));
 const keys=Object.keys(groups).sort((a,b)=>a==='#'?1:b==='#'?-1:a.localeCompare(b,lang));
 return `<div class="navtop"></div><h2 class="title">${T('Contacts','مخاطبین')}</h2>
 <div class="search">${ic('search',17)}<input id="q" value="${query}" placeholder="${T('Search','جستجو')}" oninput="query=this.value;renderContent(true)"></div>
 ${all.length?keys.map(k=>`<div class="shead" id="sec-${k}">${k}</div><div class="list">${groups[k].map(c=>`<div class="lrow" style="padding-inline-end:28px">${av(c.name)}
   <div class="grow"><div class="nm">${c.name}</div>${c.name!==c.n?`<div class="sub" style="direction:ltr;justify-content:flex-end;${lang==='fa'?'':'justify-content:flex-start'}">${c.n}</div>`:''}</div>
   <span class="rbtn" onclick="event.stopPropagation();openChat('${c.n}')">${ic('message',16)}</span>
   <span class="rbtn ${connected?'':'off'}" onclick="event.stopPropagation();startCall('${c.n}')">${ic('phone',15)}</span></div>`).join('')}</div>`).join('')
  :`<div class="empty">${ic('search',44,1.6).replace('<svg','<svg style="margin:auto"')}<b>${T('No Results','نتیجه‌ای نیست')}</b>${T('Check the spelling or try a new search.','املای عبارت را بررسی کنید یا عبارت دیگری را جستجو کنید.')}</div>`}
 ${keys.length>1&&!query?`<div class="index">${keys.map(k=>`<span onclick="document.getElementById('sec-${k}').scrollIntoView({behavior:'smooth'})">${k}</span>`).join('')}</div>`:''}`}

function keypadScreen(){
 const keys=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
 const can=connected&&dial.trim();
 return `<div class="kp"><div class="num" id="num">${dial||'&nbsp;'}</div>
  <div class="via ${connected?'':'warn'}">${connected?T(`Calls go through ${model}`,`تماس از طریق ${model}`):T('Not connected to your Android phone','به گوشی اندروید متصل نیست')}</div>
  <div class="pad">${keys.map(([d,l])=>`<div class="key" onclick="press('${d}')"><b>${d}</b>${l?`<small>${l}</small>`:''}</div>`).join('')}
   <div></div><div class="key green ${can?'':'dis'}" onclick="startCall(dial)">${ic('phone',32)}</div>
   <div class="key clear" style="visibility:${dial?'visible':'hidden'}" onclick="dial=dial.slice(0,-1);renderContent()">${ic('del',28)}</div></div></div>`}

function messagesScreen(){
 const threads=Object.values(msgs.reduce((a,m)=>{if(!a[m.from]||a[m.from].date<m.date)a[m.from]=m;return a},{})).sort((a,b)=>b.date-a.date);
 return `<div class="navtop"><span style="cursor:pointer">${ic('compose',22,1.8)}</span></div><h2 class="title">${T('Messages','پیام‌ها')}</h2>
 <div class="search">${ic('search',17)}<input placeholder="${T('Search','جستجو')}"></div>
 <div class="list">${threads.map(m=>{const n=nameOf(m.from);return `<div class="lrow" style="align-items:flex-start" onclick="openChat('${m.from}')">${av(n,46)}
  <div class="grow"><div style="display:flex;align-items:baseline;gap:8px"><div class="nm grow">${n}</div><span class="meta" style="display:flex;gap:4px;align-items:center">${shortDate(m.date)}<span class="chev">${ic('chev',13,2.4).replace('<svg',lang==='fa'?'<svg style="transform:scaleX(-1)"':'<svg')}</span></span></div>
  <div class="sub" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${m.out?T('You: ','شما: '):''}${m.body[lang==='fa'?1:0]}</div></div></div>`}).join('')}</div>`}

/* ---------- chat ---------- */
function renderChat(){
 const el=document.getElementById('chat');
 if(!chat){el.innerHTML='';return}
 const n=nameOf(chat), items=msgs.filter(m=>m.from===chat).sort((a,b)=>a.date-b.date);
 el.innerHTML=`<div class="chat"><div class="chatnav"><span class="back" onclick="chat=null;render()">${ic('back',22,2.4)}${T('Messages','پیام‌ها')}</span>
  <span class="ttl">${n}</span><span class="ph" style="${connected?'':'opacity:.4'}" onclick="startCall('${chat}')">${ic('phone',20)}</span></div>
  <div class="chatscroll" id="cs"><div class="chathead">${av(n,56)}<div class="n">${n}</div>${n!==chat?`<div class="s">${chat}</div>`:''}
   <div class="x">${T('Text Message · Android SIM','پیامک · سیم‌کارت اندروید')}</div></div>
   ${items.map((m,i)=>`${i===0||m.date-items[i-1].date>15*60e3?`<div class="stamp">${shortDate(m.date)} · ${time(m.date)}</div>`:''}
    <div class="bub ${m.out?'out':'in'}">${m.body[lang==='fa'?1:0]}</div>`).join('')}</div>
  <div class="composer" style="flex-wrap:wrap">${connected?'':`<div class="warnline">${T("Not connected — messages can't be sent right now.",'متصل نیست؛ فعلاً امکان ارسال پیامک نیست.')}</div>`}
   <input id="draft" placeholder="${T('Text Message','پیامک')}" oninput="document.getElementById('sendb').classList.toggle('off',!(connected&&this.value.trim()))" onkeydown="if(event.key==='Enter')sendMsg()">
   <div class="send off" id="sendb" onclick="sendMsg()">${ic('up',18,2.6)}</div></div></div>`;
 const cs=document.getElementById('cs');cs.scrollTop=cs.scrollHeight;
}
function sendMsg(){const d=document.getElementById('draft');const v=d.value.trim();if(!v||!connected)return;
 msgs.push({from:chat,out:true,body:[v,v],date:Date.now()});renderChat()}
function openChat(n){chat=n;tab='messages';render()}

/* ---------- active call ---------- */
function renderCall(){
 const el=document.getElementById('call'), pill=document.getElementById('pill');
 if(!call){el.innerHTML='';pill.innerHTML='';return}
 const n=nameOf(call.number), tm=call.start?clock():(T('Connecting…','در حال اتصال…'));
 if(call.min){el.innerHTML='';pill.innerHTML=`<div class="callpill" onclick="call.min=false;render()">${ic('phone',15)}${n}<span id="ptm" style="font-variant-numeric:tabular-nums">${call.start?clock():''}</span></div>`;return}
 pill.innerHTML='';
 const keys=['1','2','3','4','5','6','7','8','9','*','0','#'];
 el.innerHTML=`<div class="call"><div class="min" onclick="call.min=true;render()">${ic('chevdown',18,2.6)}</div>
  <div style="height:110px"></div>${av(n,call.keypad?72:112)}
  <div class="who" style="font-size:${call.keypad?26:32}px">${n}</div>
  ${n!==call.number?`<div class="numl">${call.number}</div>`:''}
  <div class="tm" id="tm">${call.keypad&&call.dtmf?call.dtmf:tm}</div>
  <div class="via2">${T('via '+model,'از طریق '+model)}</div>
  ${call.keypad?`<div class="cpad">${keys.map(k=>`<div class="key" onclick="call.dtmf+='${k}';renderCall()"><b>${k}</b></div>`).join('')}</div>`
   :`<div class="ctrls">
    <div class="cbtn ${call.muted?'on':''}"><div onclick="call.muted=!call.muted;renderCall()">${ic('micslash',26,2)}</div>${T('Mute','بی‌صدا')}</div>
    <div class="cbtn"><div onclick="call.keypad=true;renderCall()">${ic('grid',26)}</div>${T('Keypad','صفحه‌کلید')}</div>
    <div class="cbtn ${call.speaker?'on':''}"><div onclick="call.speaker=!call.speaker;renderCall()">${ic('speaker',26,2)}</div>${T('Speaker','بلندگو')}</div></div>`}
  <div class="endrow"><div class="end" onclick="endCall()"><span style="transform:rotate(135deg)">${ic('phone',32)}</span></div>
   ${call.keypad?`<span class="hidebtn" onclick="call.keypad=false;renderCall()">${T('Hide','پنهان')}</span>`:''}</div></div>`;
}
const clock=()=>{const s=Math.floor((Date.now()-call.start)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function startCall(n){if(!connected||!n)return;chat=null;call={number:n,start:0,muted:false,speaker:false,keypad:false,dtmf:'',min:false};render();
 clearTimeout(window.ct);window.ct=setTimeout(()=>{if(call){call.start=Date.now();renderCall()}},1800)}
function endCall(){call=null;dial='';render()}
setInterval(()=>{if(!call||!call.start)return;const a=document.getElementById('tm');if(a&&!(call.keypad&&call.dtmf))a.textContent=clock();
 const b=document.getElementById('ptm');if(b)b.textContent=clock()},1000);

/* ---------- shell ---------- */
const tabs=[{id:'calls',en:'Recents',fa:'اخیر',ic:'clock'},{id:'contacts',en:'Contacts',fa:'مخاطبین',ic:'person'},
 {id:'keypad',en:'Keypad',fa:'صفحه‌کلید',ic:'grid'},{id:'messages',en:'Messages',fa:'پیام‌ها',ic:'message'},{id:'settings',en:'Settings',fa:'تنظیمات',ic:'gear'}];
function renderContent(keepFocus){
 const map={calls:recentsScreen,contacts:contactsScreen,keypad:keypadScreen,messages:messagesScreen,settings:settings};
 const c=document.getElementById('content');c.innerHTML=map[tab]();
 document.getElementById('screen').classList.toggle('white',tab==='keypad');
 if(keepFocus){const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
function render(){
 document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 renderContent();
 const tb=document.getElementById('tabbar');
 tb.classList.toggle('hide',!!chat);
 tb.innerHTML=tabs.map(t=>`<div class="tab ${t.id===tab?'on':''}" onclick="tab='${t.id}';chat=null;query='';render()">${ic(t.ic,21,2.1)}${T(t.en,t.fa)}</div>`).join('');
 document.getElementById('sbar').innerHTML=`<span style="display:flex;gap:6px;align-items:center">${ic('wifi',16,2.4)}<svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.6"/><rect x="23" y="4" width="1.6" height="4" rx=".8" opacity=".4"/></svg></span>`;
 renderChat(); renderCall();
 document.getElementById('note').innerHTML=`<h1>${T('SimBridge iOS preview','پیش‌نمایش SimBridge برای iOS')}</h1>
  ${T('A browser mockup of the light, iOS-native redesign in the SwiftUI code: grouped Settings with a connection card, Recents, Contacts with an index, Keypad, Messages with chat bubbles, the in-call screen and a floating Liquid Glass tab bar. Data is sample data.',
      'ماکت مرورگری از طراحی روشن و بومی iOS که در کد SwiftUI پیاده شده: تنظیمات گروه‌بندی‌شده با کارت وضعیت اتصال، تماس‌های اخیر، مخاطبین با فهرست حروف، صفحه‌کلید، پیام‌ها با حباب‌های گفتگو، صفحهٔ تماس و نوار تب شناور Liquid Glass. داده‌ها نمونه‌اند.')}
  <br><br>${T('Tap a recent or contact to start a call, open a conversation, or toggle the connection to see the offline states.','روی یک تماس یا مخاطب بزنید تا تماس شروع شود، یک گفتگو را باز کنید، یا اتصال را قطع و وصل کنید تا حالت آفلاین را ببینید.')}<br>
  <button onclick="setLang(lang==='fa'?'en':'fa')">${lang==='fa'?'English':'فارسی'}</button>
  <button onclick="connected=!connected;if(!connected)call=null;render()">${connected?T('Simulate disconnect','شبیه‌سازی قطع اتصال'):T('Reconnect','اتصال دوباره')}</button>`;
}
function setLang(l){lang=l;render()}
function press(d){if(dial.length<32){dial+=d;renderContent()}}
render();
</script>
</body>
</html>
